spring.main.banner-mode=off
logging.level.root = warn
logging.level.com.vasyerp.rolebasedsystem.scheduler=INFO
logging.level.com.vasyerp.rolebasedsystem.service.CompleteDataExcelExportService=INFO
app.countries=India,USA,UK,Canada,Australia

# Active Profile
spring.profiles.active=local

## Database Configuration
#spring.datasource.url=jdbc:postgresql://localhost:5432/rolebasedsystem
#spring.datasource.username=postgres
#spring.datasource.password=your_password
#spring.datasource.driver-class-name=org.postgresql.Driver
#
## JPA Configuration
#spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.security.user.password=admin
spring.security.user.name=admin

# JSP Configuration
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp
spring.cache.type=redis
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true
management.endpoint.health.show-details=always
app.export.scheduled.enabled=true
app.export.cron=0 10 16 * * *
app.export.directory=exports
