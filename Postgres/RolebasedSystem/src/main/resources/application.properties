spring.main.banner-mode=off
logging.level.root = warn
app.countries=India,USA,UK,Canada,Australia

# Active Profile
spring.profiles.active=local

## Database Configuration
#spring.datasource.url=jdbc:postgresql://localhost:5432/rolebasedsystem
#spring.datasource.username=postgres
#spring.datasource.password=your_password
#spring.datasource.driver-class-name=org.postgresql.Driver
#
## JPA Configuration
#spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.security.user.password=admin
spring.security.user.name=admin

# JSP Configuration
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# Redis defaults (overridden in application-local.properties if needed)
spring.cache.type=redis

# Expose actuator endpoints
management.endpoints.web.exposure.include=health,info,prometheus

# Enable Prometheus endpoint
management.endpoint.prometheus.enabled=true

# Optional: show full health details
management.endpoint.health.show-details=always